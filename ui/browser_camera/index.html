<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #263a2d; font: 14px 'Prompt', system-ui, sans-serif; }
    .camera { padding: 12px 0 2px; background: transparent; }
    .viewports { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .preview-card { min-width: 0; }
    .preview-label { margin: 0 0 6px; color: #5e7266; font-size: 12px; font-weight: 600; }
    .viewport { display: grid; place-items: center; width: 100%; aspect-ratio: 4/3; overflow: hidden; border-radius: 12px; background: #263a2d; box-shadow: inset 0 0 0 1px rgba(38,58,45,.08); }
    video, .snapshot img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .snapshot { width: 100%; height: 100%; }
    .snapshot-placeholder { padding: 12px; color: #dbe8dc; text-align: center; font-size: 12px; }
    .snapshot[hidden] { display: none; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    button { min-height: 40px; border: 0; border-radius: 8px; padding: 9px 14px; font: inherit; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 3px solid #d9a441; outline-offset: 3px; }
    .primary { color: white; background: #397a54; }
    .primary:hover:not(:disabled) { background: #2f6747; }
    .secondary { color: #263a2d; background: #edf4e9; }
    button:disabled { opacity: .5; cursor: default; }
    .message { min-height: 20px; margin-top: 8px; color: #5e7266; font-size: 13px; }
    .error { color: #a5392b; }
    @media (max-width: 500px) { .viewports { grid-template-columns: 1fr; } .viewport { max-height: 250px; } }
  </style>
</head>
<body>
  <div class="camera">
    <div class="viewports">
      <div class="preview-card">
        <p class="preview-label">Live view</p>
        <div class="viewport"><video id="video" autoplay playsinline muted></video></div>
      </div>
      <div class="preview-card">
        <p class="preview-label">Captured photo</p>
        <div class="viewport">
          <div id="snapshotPlaceholder" class="snapshot-placeholder">Your photo will appear here</div>
          <div id="snapshot" class="snapshot" hidden>
            <img id="photo" alt="Photo captured from the webcam">
          </div>
        </div>
      </div>
    </div>
    <div class="actions">
      <button id="start" class="primary">Start webcam</button>
      <button id="capture" class="primary" disabled>Take photo</button>
      <button id="stop" class="secondary" disabled>Stop camera</button>
    </div>
    <div id="message" class="message" aria-live="polite">Use a camera connected to this browser. Your browser will ask for camera access.</div>
  </div>
  <canvas id="canvas" hidden></canvas>
  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const startButton = document.getElementById("start");
    const captureButton = document.getElementById("capture");
    const stopButton = document.getElementById("stop");
    const message = document.getElementById("message");
    const snapshot = document.getElementById("snapshot");
    const snapshotPlaceholder = document.getElementById("snapshotPlaceholder");
    const photo = document.getElementById("photo");
    let stream = null;

    function send(type, extra = {}) {
      window.parent.postMessage({ isStreamlitMessage: true, type, ...extra }, "*");
    }
    function resizeFrame() {
      send("streamlit:setFrameHeight", { height: document.body.scrollHeight });
    }
    function stopCamera() {
      if (stream) stream.getTracks().forEach(track => track.stop());
      stream = null;
      video.srcObject = null;
      startButton.disabled = false;
      captureButton.disabled = true;
      stopButton.disabled = true;
    }

    startButton.addEventListener("click", async () => {
      if (!navigator.mediaDevices?.getUserMedia) {
        message.textContent = "Camera access needs a secure page (HTTPS or localhost) and a supported browser.";
        message.className = "message error";
        return;
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = stream;
        await video.play();
        startButton.disabled = true;
        captureButton.disabled = false;
        stopButton.disabled = false;
        message.textContent = "Live camera preview. Take a photo when ready.";
        message.className = "message";
        resizeFrame();
      } catch (error) {
        message.textContent = error.name === "NotAllowedError"
          ? "Camera permission was denied. Allow camera access for this site, then try again."
          : "Could not start the webcam. Check that a camera is connected and not in use by another app.";
        message.className = "message error";
      }
    });

    captureButton.addEventListener("click", () => {
      if (!video.videoWidth || !video.videoHeight) return;
      const scale = Math.min(1, 1600 / video.videoWidth);
      canvas.width = Math.round(video.videoWidth * scale);
      canvas.height = Math.round(video.videoHeight * scale);
      canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
      const data = canvas.toDataURL("image/jpeg", 0.88);
      const id = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      photo.src = data;
      snapshot.hidden = false;
      snapshotPlaceholder.hidden = true;
      send("streamlit:setComponentValue", { value: { id, data }, dataType: "json" });
      message.textContent = "Photo added to your images. Take another photo to replace this preview.";
      message.className = "message";
      resizeFrame();
    });
    stopButton.addEventListener("click", () => {
      stopCamera();
      message.textContent = "Webcam stopped.";
      message.className = "message";
      resizeFrame();
    });

    window.addEventListener("message", event => {
      if (event.data?.type === "streamlit:render") resizeFrame();
    });
    window.addEventListener("pagehide", stopCamera);
    window.addEventListener("beforeunload", stopCamera);
    send("streamlit:componentReady", { apiVersion: 1 });
    resizeFrame();
  </script>
</body>
</html>
